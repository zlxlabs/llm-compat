name: Release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read project version
        id: version
        run: |
          set -euo pipefail
          version="$(python scripts/release/extract_release_notes.py --version)"
          {
            echo "version=${version}"
            echo "tag=v${version}"
          } >> "$GITHUB_OUTPUT"
          echo "当前项目版本：${version}（目标 tag：v${version}）"

      - name: Check whether version tag already exists
        id: tag_check
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag_exists=false

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_exists=true
          else
            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              tag_exists=true
            else
              remote_status=$?
              if [ "$remote_status" -ne 2 ]; then
                echo "检查远程 tag ${RELEASE_TAG} 失败，拒绝继续发布。" >&2
                exit "$remote_status"
              fi
            fi
          fi

          echo "exists=${tag_exists}" >> "$GITHUB_OUTPUT"
          if [ "$tag_exists" = true ]; then
            message="版本 ${RELEASE_VERSION} 已有 tag，跳过发布"
            echo "$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "版本 ${RELEASE_VERSION} 尚无 tag，继续准备发布。"
          fi

      - name: Extract CHANGELOG release notes
        if: steps.tag_check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python scripts/release/extract_release_notes.py \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Create and push annotated version tag
        if: steps.tag_check.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"
